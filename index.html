<script>
    const matScores = {
        1: { p1: 0, p2: 0 },
        2: { p1: 8, p2: 9 },
        3: { p1: 18, p2: 18 },
        4: { p1: 21, p2: 15 }
    };

    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    function addPt(matId, playerNum, pts) {
        if (playerNum === 1) {
            matScores[matId].p1 += pts;
            document.getElementById(`m${matId}-p1-score`).innerText = matScores[matId].p1;
        } else {
            matScores[matId].p2 += pts;
            document.getElementById(`m${matId}-p2-score`).innerText = matScores[matId].p2;
        }
    }

    function flagPt(matId, playerNum) {
        if (playerNum === 1) {
            matScores[matId].p1 = Math.max(0, matScores[matId].p1 - 1);
            document.getElementById(`m${matId}-p1-score`).innerText = matScores[matId].p1;
        } else {
            matScores[matId].p2 = Math.max(0, matScores[matId].p2 - 1);
            document.getElementById(`m${matId}-p2-score`).innerText = matScores[matId].p2;
        }
    }

    // LISTENER: Listen for live updates sent from index.html (Scorekeeper)
    function listenForLiveMat1Updates() {
        const updateMat1UI = () => {
            const rawData = localStorage.getItem('railway_mat1_data');
            if (!rawData) return;
            const data = JSON.parse(rawData);

            // Update Mat 1 Card elements dynamically
            const mat1Card = document.querySelector('.mat-card:nth-child(1)');
            if (mat1Card) {
                // Update names
                const names = mat1Card.querySelectorAll('.p-name');
                if (names[0]) names[0].innerText = data.playerA;
                if (names[1]) names[1].innerText = data.playerB;

                // Update scores
                document.getElementById('m1-p1-score').innerText = data.scoreA;
                document.getElementById('m1-p2-score').innerText = data.scoreB;
                matScores[1].p1 = data.scoreA;
                matScores[1].p2 = data.scoreB;

                // Update Quarter & Timer
                document.getElementById('m1-qtr').innerText = data.quarter;
                let mins = Math.floor(data.timeLeft / 60);
                let secs = data.timeLeft % 60;
                document.getElementById('m1-timer').innerText = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                // Update Status Badge
                const statusBadge = document.getElementById('m1-status');
                statusBadge.innerText = data.status;
                if (data.status === 'LIVE') {
                    statusBadge.className = 'status-badge status-live';
                } else {
                    statusBadge.className = 'status-badge status-pause';
                }
            }
        };

        // Listen for storage changes across tabs
        window.addEventListener('storage', (e) => {
            if (e.key === 'railway_mat1_data') {
                updateMat1UI();
            }
        });

        // Load current saved state immediately on page load
        updateMat1UI();
    }

    // Initialize listener on load
    listenForLiveMat1Updates();
</script>
